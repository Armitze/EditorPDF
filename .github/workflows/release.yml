name: Compilar y publicar

# Cada push a main compila el .exe en Windows y publica un GitHub Release.
# La app instalada consulta ese release y se ofrece a actualizarse sola.
on:
  push:
    branches: [main]
    # Cambios que no afectan al binario no disparan una versión nueva.
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.github/**'
  workflow_dispatch:   # permite lanzarlo a mano desde la pestaña Actions

# Necesario para que la Action pueda crear el release y subir el .zip.
permissions:
  contents: write

concurrency:
  # Un push nuevo cancela el build anterior en curso (no publica versiones viejas).
  group: release
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Calcular versión (AÑO.MMDD.BUILD)
        id: ver
        shell: pwsh
        run: |
          # AÑO.MMDD a partir de la fecha UTC + número de run como build:
          # siempre creciente, así la comparación de versiones nunca retrocede.
          $date = (Get-Date).ToUniversalTime()
          $version = '{0}.{1}.{2}' -f $date.Year, $date.ToString('MMdd'), $env:GITHUB_RUN_NUMBER
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          Write-Host "Versión: $version"

      - name: Escribir la versión en version.py
        shell: pwsh
        run: |
          # El .exe publicado debe llevar exactamente la versión de este release.
          $v = '${{ steps.ver.outputs.version }}'
          $path = 'version.py'
          $content = Get-Content -LiteralPath $path -Raw
          $content = $content -replace "__version__ = '.*'", "__version__ = '$v'"
          Set-Content -LiteralPath $path -Value $content -NoNewline -Encoding utf8
          Write-Host "version.py actualizado a $v"

      - name: Generar el icono
        run: python make_icon.py

      - name: Preparar Tesseract (motor de OCR + idiomas spa/eng)
        shell: pwsh
        run: |
          # La carpeta tesseract\ NO se versiona (~166 MB, ver .gitignore), así
          # que CI no la tiene tras el checkout. Se instala Tesseract de
          # UB-Mannheim (la misma fuente que el README) y se copia a una carpeta
          # local tesseract\ con solo lo necesario, para que PyInstaller la
          # empaquete DENTRO del .exe (ocr.py la busca en sys._MEIPASS/tesseract).
          # Así el OCR funciona en cualquier PC y sobrevive a las actualizaciones.
          $ErrorActionPreference = 'Stop'
          choco install tesseract --params "/InstallDir:C:\Tesseract-OCR" -y --no-progress
          $src = 'C:\Tesseract-OCR'
          if (-not (Test-Path -LiteralPath "$src\tesseract.exe")) {
            # Ruta por defecto del paquete de choco, por si -InstallDir no aplicó.
            $src = 'C:\Program Files\Tesseract-OCR'
          }
          if (-not (Test-Path -LiteralPath "$src\tesseract.exe")) {
            throw "No se encontró tesseract.exe tras la instalación (buscado en $src)."
          }
          # Descargar el modelo de español (choco solo trae inglés + osd).
          $spa = Join-Path $src 'tessdata\spa.traineddata'
          if (-not (Test-Path -LiteralPath $spa)) {
            Invoke-WebRequest -Uri 'https://github.com/tesseract-ocr/tessdata_fast/raw/main/spa.traineddata' -OutFile $spa
          }
          # Copiar SOLO el ejecutable, sus DLL y los modelos spa/eng al paquete.
          # (Se omiten las decenas de .exe de entrenamiento y la doc: no hacen
          # falta en runtime y abultarían el .zip de actualización.)
          New-Item -ItemType Directory -Force -Path 'tesseract\tessdata' | Out-Null
          Copy-Item -LiteralPath "$src\tesseract.exe" -Destination 'tesseract\' -Force
          Copy-Item -Path "$src\*.dll" -Destination 'tesseract\' -Force
          foreach ($lang in @('spa','eng','osd')) {
            $td = Join-Path $src "tessdata\$lang.traineddata"
            if (Test-Path -LiteralPath $td) { Copy-Item -LiteralPath $td -Destination 'tesseract\tessdata\' -Force }
          }
          $langs = (Get-ChildItem 'tesseract\tessdata\*.traineddata' | ForEach-Object { $_.BaseName }) -join ', '
          Write-Host "Tesseract preparado. Idiomas: $langs"

      - name: Compilar con PyInstaller
        run: |
          # --collect-data docx: python-docx trae una plantilla default.docx que
          # PyInstaller no detecta (es dato, no código); sin ella la exportación
          # a Word falla en el .exe. --hidden-import docx por si el análisis
          # estático no ve el import (es perezoso dentro de exportword/pdfcore).
          # --add-data tesseract: incluye el motor de OCR (spa/eng) DENTRO del
          # paquete (ver paso anterior). Debe coincidir con build.ps1.
          python -m PyInstaller --noconfirm --clean --onedir --windowed `
            --name PDFEditorPro --icon assets\icon.ico --add-data "ui;ui" `
            --add-data "tesseract;tesseract" `
            --collect-submodules fastapi `
            --collect-submodules starlette `
            --collect-submodules uvicorn `
            --collect-submodules webview `
            --collect-data docx `
            --hidden-import docx `
            main.py
        shell: pwsh

      - name: Empaquetar la carpeta en un .zip
        shell: pwsh
        run: |
          # Comprime la carpeta PDFEditorPro entera (mantiene la carpeta raíz
          # dentro del zip, que es lo que espera el aplicador de actualizaciones).
          Compress-Archive -Path dist\PDFEditorPro -DestinationPath PDFEditorPro-windows.zip -Force
          $size = (Get-Item PDFEditorPro-windows.zip).Length
          Write-Host "ZIP: $([math]::Round($size/1MB,1)) MB"

      - name: Publicar el Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: PDF Editor Pro ${{ steps.ver.outputs.version }}
          body: |
            Versión ${{ steps.ver.outputs.version }} compilada automáticamente desde `main`.

            La app instalada detectará esta versión y ofrecerá actualizarse sola.
          files: PDFEditorPro-windows.zip
          make_latest: true
